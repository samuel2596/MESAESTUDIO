<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de estudio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1626" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mesa de estudio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--grid:#d3dce9;--card:#fff;--ink:#14213d;--muted:#55627d;--pri:#14213d;--pri-ink:#fff;--hl:#ffd60a;--ok:#c8f0d4;--bad:#ffd0cc;
--head:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--grid:#1b2640;--card:#172036;--ink:#e8edf7;--muted:#9aa7c2;--pri:#ffd60a;--pri-ink:#0f1626;--ok:#1f5a37;--bad:#6b2a26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1626;--grid:#1b2640;--card:#172036;--ink:#e8edf7;--muted:#9aa7c2;--pri:#ffd60a;--pri-ink:#0f1626;--ok:#1f5a37;--bad:#6b2a26;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.brand{font-family:var(--head);margin:0;line-height:1.1}
h1{font-size:clamp(30px,5vw,44px);font-weight:800;margin-bottom:8px}
h3{font-size:21px;font-weight:600}
.muted{color:var(--muted);margin:4px 0 18px}
.brand{font-size:24px;font-weight:800;padding:18px 16px 0}
.brand b{background:var(--hl);color:#14213d;padding:0 6px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;font:600 15px var(--head);color:var(--muted);background:none;border:0;padding:14px 4px;cursor:pointer}
nav button[aria-current="true"]{color:var(--ink);box-shadow:inset 0 -5px 0 var(--hl)}
nav .brand{display:none}
main{max-width:880px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:4px;box-shadow:5px 5px 0 var(--ink);padding:18px}
.card.on{background:var(--hl);color:#14213d}.card.on .muted{color:#3b4660}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.add{font:600 18px var(--head);color:var(--ink);cursor:pointer;min-height:130px;border-style:dashed;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{font:600 16px var(--head);color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:11px 18px;min-height:46px;cursor:pointer}
.btn.p{background:var(--pri);color:var(--pri-ink)}.card.on .btn.p{background:#14213d;color:#fff}
.btn:focus-visible,.flash:focus-visible,.opt:focus-visible,nav button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.row.two .btn{flex:1}
.bar{height:10px;border:2px solid var(--ink);background:var(--card)}.bar i{display:block;height:100%;background:var(--ink)}
.flash{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;width:100%;min-height:min(48vh,360px);padding:28px;margin:14px 0 6px;font:600 clamp(24px,4.4vw,38px)/1.25 var(--head);color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--ink);cursor:pointer}
.flash.back{background:var(--hl);color:#14213d;animation:pop .22s}
.flash span{font:500 15px system-ui,sans-serif;opacity:.7}
@keyframes pop{from{transform:translateY(6px) rotate(-.6deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.flash.back{animation:none}}
.q{font-size:clamp(22px,3.6vw,30px);font-weight:600;margin:6px 0 16px}
.opts{display:grid;gap:12px}
.opt{font:inherit;text-align:left;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:14px 16px;cursor:pointer}
.opt.ok{background:var(--ok)}.opt.bad{background:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.big{font:600 24px var(--head)}
label{display:block;font-weight:600;margin:14px 0}
input,textarea{display:block;width:100%;margin-top:6px;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:12px}
.err{color:#b42318;font-weight:600}.hint{font-size:14px}
@media (prefers-color-scheme:dark){.err{color:#ff8c82}}
@media (min-width:840px){
 body>.top{display:none}
 nav{top:0;right:auto;width:220px;flex-direction:column;border-top:0;border-right:2px solid var(--ink);padding:calc(env(safe-area-inset-top,0px) + 8px) 0 0}
 nav .brand{display:block;padding:14px 18px 22px}
 nav button{text-align:left;padding:16px 20px;font-size:18px}
 nav button[aria-current="true"]{box-shadow:inset 6px 0 0 var(--hl)}
 main{margin-left:220px;max-width:none;padding:36px 48px 60px}
 main>*{max-width:820px}
}
.t{align-items:center;margin:0 0 14px}.t .btn{min-height:38px;padding:6px 14px;font-size:15px}
.timer{margin:0 0 14px;color:var(--muted)}.timer b{font:800 20px var(--head);color:var(--ink)}.timer .btn{min-height:34px;padding:4px 12px;font-size:14px;margin-left:8px}
.pause{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(20,33,61,.72)}.pause .card{max-width:420px}
.ex{font:14px ui-monospace,Menlo,monospace}
body.focus nav,body.focus>.top{display:none}
body.focus main{margin:0 auto;max-width:720px;padding:24px 16px 40px}
.sec{margin:22px 0 10px}
.rw{display:grid;grid-template-columns:28px 1fr 40px;gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:12px;margin-bottom:12px}
.rw .n{grid-column:1;grid-row:1;font:700 15px var(--head);color:var(--muted);padding-top:12px}
.rw input{margin:0}.rw .it{grid-column:2;grid-row:1}.rw .id{grid-column:2;grid-row:2}
.rw .x{grid-column:3;grid-row:1;font:700 18px var(--head);color:var(--muted);background:none;border:0;cursor:pointer;min-height:44px}.rw .x:focus-visible{outline:3px solid var(--hl)}
.bulk{margin-top:18px;border:2px dashed var(--ink);border-radius:4px;padding:12px}.bulk summary{cursor:pointer;font:600 16px var(--head)}.bulk textarea{margin-top:10px}
@media (min-width:640px){.rw{grid-template-columns:28px 1fr 1fr 44px}.rw .id{grid-column:3;grid-row:1}.rw .x{grid-column:4}}
</style>
</head>
<body>
<div class="brand top">Mesa de <b>estudio</b></div>
<nav>
 <div class="brand">Mesa de <b>estudio</b></div>
 <button data-go="sets">Mis sets</button>
 <button data-go="review">Repasar</button>
 <button data-go="quiz">Practicar</button>
</nav>
<main id="main"></main>
<script>
const KEY='mesa-estudio-v1',$=s=>document.querySelector(s);
let S,view='sets',R={},Q={},E={},focus=false,FOC=false,T=null,tick=null;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const parse=t=>t.split(/\n/).map(l=>l.match(l.includes('::')?/^(.+?)\s*::\s*(.+)$/:/^(.+?)\s*(?:—|\t)\s*(.+)$/)).filter(Boolean).map(m=>({t:m[1].trim(),d:m[2].trim()}));
const clean=s=>s.replace(/\s+/g,' ').trim();
const ser=rs=>rs.map(r=>clean(r.t).replace(/::/g,':')+' :: '+clean(r.d)).join('\n');
const cur=()=>S.sets.find(s=>s.id===S.active);
const cards=()=>{const c=cur();return c?parse(c.text):[]};
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S||!Array.isArray(S.sets)||!S.sets.length){const id=uid();
  S={active:id,sets:[{id,title:'Ejemplo: capitales',text:'México :: Ciudad de México\nPerú :: Lima\nChile :: Santiago\nColombia :: Bogotá\nArgentina :: Buenos Aires\nUruguay :: Montevideo'}]}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function startReview(){const q=shuf(cards());R={sid:S.active,q,total:q.length,known:0,flip:false}}
function startQuiz(){const cs=cards();Q={sid:S.active,i:0,score:0,pick:null,items:shuf(cs).map(k=>({k,opts:shuf([k,...shuf(cs.filter(x=>x!==k)).slice(0,3)])}))}}
const vSets=()=>`<h1>Mis sets</h1><p class="muted">Elige un set para estudiar o crea uno pegando tus apuntes.</p><div class="grid">${S.sets.map(s=>`<article class="card${s.id===S.active?' on':''}"><h3>${esc(s.title)}</h3><p class="muted">${parse(s.text).length} términos</p><div class="row"><button class="btn p" data-act="study" data-id="${s.id}">Estudiar</button><button class="btn" data-act="edit" data-id="${s.id}">Editar</button><button class="btn" data-act="exp" data-id="${s.id}">Exportar</button></div></article>`).join('')}<button class="card add" data-act="new">+ Crear set</button><button class="card add" data-act="imp">+ Importar set</button></div>`;
const vEdit=()=>`<h1>${E.id?'Editar set':'Crear set'}</h1><label>Título<input id="ti" value="${esc(E.title)}" placeholder="Ej. Unidad 3"></label><h3 class="sec">Tarjetas</h3>${(E.rows||[]).map((r,i)=>`<div class="rw"><span class="n">${i+1}</span><input class="it" value="${esc(r.t)}" placeholder="Pregunta o término" aria-label="Pregunta o término ${i+1}"><input class="id" value="${esc(r.d)}" placeholder="Respuesta o definición" aria-label="Respuesta o definición ${i+1}"><button class="x" data-act="delrow" data-i="${i}" aria-label="Quitar tarjeta ${i+1}">✕</button></div>`).join('')}<div class="row"><button class="btn" data-act="addrow">+ Agregar tarjeta</button></div><details class="bulk"><summary>Pegar varias tarjetas a la vez</summary><p class="muted hint">Una por línea, así: término :: definición</p><textarea id="bk" rows="5"></textarea><div class="row"><button class="btn" data-act="bulk">Agregar estas tarjetas</button></div></details>${E.err?`<p class="err">${E.err}</p>`:''}<div class="row"><button class="btn p" data-act="save">Guardar set</button><button class="btn" data-act="cancel">Cancelar</button>${E.id?`<button class="btn" data-act="del">${E.sure?'¿Seguro? Toca otra vez':'Eliminar set'}</button>`:''}</div>`;
function vReview(){
 if(!R.total)return `<h1>Repasar</h1><p class="muted">Este set no tiene términos todavía. Edítalo en “Mis sets”.</p>`;
 if(!R.q.length)return `<h1>Set repasado</h1><p class="big">Dominaste los ${R.total} términos.</p><div class="row"><button class="btn p" data-act="restart">Repasar de nuevo</button><button class="btn" data-go="quiz">Practicar</button>${focus?'<button class="btn" data-act="focus">Salir del modo enfoque</button>':''}</div>`;
 const k=R.q[0];
 if(focus)return `${vTimer(1)}<button class="flash${R.flip?' back':''}" data-act="flip"><span>${R.flip?'Definición':'Término'}</span>${esc(R.flip?k.d:k.t)}</button><div class="row two"><button class="btn" data-act="again">Repasar otra vez</button><button class="btn p" data-act="known">Ya lo sé</button></div><div class="row"><button class="btn" data-act="focus">Salir del modo enfoque</button></div>`;
 return `<h1>Repasar</h1>${vTimer()}<div class="bar"><i style="width:${R.known/R.total*100}%"></i></div><p class="muted">${R.known} de ${R.total} dominados. Quedan ${R.q.length}.</p><button class="flash${R.flip?' back':''}" data-act="flip"><span>${R.flip?'Definición':'Término'}</span>${esc(R.flip?k.d:k.t)}</button><div class="row two"><button class="btn" data-act="again">Repasar otra vez</button><button class="btn p" data-act="known">Ya lo sé</button></div><div class="row"><button class="btn" data-act="focus">Modo enfoque</button></div><p class="muted hint">Toca la tarjeta para voltearla. Con teclado: espacio, ← y →.</p>`}
function vQuiz(){
 if(!Q.items||Q.items.length<2)return `<h1>Practicar</h1><p class="muted">Necesitas al menos 2 términos en el set para practicar.</p>`;
 if(Q.i>=Q.items.length)return `<h1>Resultado</h1><p class="big">${Q.score} de ${Q.items.length} correctas</p><div class="row"><button class="btn p" data-act="requiz">Intentar de nuevo</button><button class="btn" data-go="review">Repasar</button></div>`;
 const it=Q.items[Q.i];
 return `<h1>Practicar</h1>${vTimer()}<p class="muted">Pregunta ${Q.i+1} de ${Q.items.length}</p><h2 class="q">${esc(it.k.t)}</h2><div class="opts">${it.opts.map((o,j)=>{let c='opt';if(Q.pick!==null){if(o===it.k)c+=' ok';else if(j===Q.pick)c+=' bad'}return `<button class="${c}" data-act="pick" data-j="${j}"${Q.pick!==null?' disabled':''}>${esc(o.d)}</button>`}).join('')}</div>${Q.pick!==null?`<div class="row"><button class="btn p" data-act="next">Siguiente</button></div>`:''}`}
const fmt=ms=>{const s=Math.ceil(ms/1000);return (s/60|0)+':'+String(s%60).padStart(2,'0')};
function startT(m){clearInterval(tick);T={end:Date.now()+m*60000};tick=setInterval(tickT,1000)}
function tickT(){if(!T)return;const l=T.end-Date.now();if(l<=0){clearInterval(tick);T.over=true;if(view==='edit')readE();render();return}const e=$('#tm');if(e)e.textContent=fmt(l)}
const vTimer=f=>T&&!T.over?`<p class="timer">Tiempo: <b id="tm">${fmt(T.end-Date.now())}</b><button class="btn" data-act="tstop">Detener</button></p>`:(T||f)?'':`<div class="row t"><span class="muted">Sesión corta:</span><button class="btn" data-act="t5">5 min</button><button class="btn" data-act="t10">10 min</button></div>`;
const vPause=()=>`<div class="pause" role="dialog" aria-modal="true"><div class="card"><h2>Sesión terminada</h2><p>Buen trabajo. Levántate, toma agua y descansa unos minutos antes de seguir.</p><div class="row"><button class="btn p" data-act="t5">Otra sesión de 5 min</button><button class="btn" data-act="tstop">Terminar por hoy</button></div></div></div>`;
const enc=s=>'MESA1:'+btoa(unescape(encodeURIComponent(JSON.stringify({title:s.title,text:s.text}))));
const dec=c=>{try{c=c.trim();if(c.indexOf('MESA1:')!==0)return null;const d=JSON.parse(decodeURIComponent(escape(atob(c.slice(6)))));return d&&typeof d.title==='string'&&typeof d.text==='string'&&parse(d.text).length?d:null}catch(e){return null}};
const vExport=()=>`<h1>Exportar set</h1><p class="muted">Copia este código y mándalo por mensaje. Quien lo reciba abre su Mesa de estudio, elige Importar set y lo pega.</p><textarea id="ex" class="ex" rows="6" readonly>${esc(E.code)}</textarea><div class="row"><button class="btn p" data-act="copy">Copiar código</button><button class="btn" data-act="cancel">Volver</button></div><p id="cm" class="muted hint"></p>`;
const vImport=()=>`<h1>Importar set</h1><p class="muted">Pega aquí el código que te mandaron.</p><textarea id="im" class="ex" rows="6" placeholder="MESA1:...">${esc(E.code)}</textarea>${E.err?`<p class="err">${E.err}</p>`:''}<div class="row"><button class="btn p" data-act="doimp">Importar set</button><button class="btn" data-act="cancel">Cancelar</button></div>`;
function render(){
 const nv=['edit','export','import'].includes(view)?'sets':view;
 document.querySelectorAll('nav [data-go]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.go===nv)));
 $('#main').innerHTML=({sets:vSets,edit:vEdit,export:vExport,import:vImport,review:vReview,quiz:vQuiz})[view]()+(T&&T.over?vPause():'');
 if(FOC){FOC=false;const a=document.querySelectorAll('.rw .it');if(a.length)a[a.length-1].focus()}
}
function readE(){const t=$('#ti');if(!t)return;E.title=t.value;E.rows=[...document.querySelectorAll('.rw')].map(w=>({t:w.querySelector('.it').value,d:w.querySelector('.id').value}))}
function go(v){if(v!=='review'&&focus){focus=false;document.body.classList.remove('focus')}view=v;if(v==='review'&&R.sid!==S.active)startReview();if(v==='quiz'&&Q.sid!==S.active)startQuiz();render();scrollTo(0,0)}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-go],[data-act]');if(!b)return;
 if(b.dataset.go)return go(b.dataset.go);
 const a=b.dataset.act,id=b.dataset.id;
 if(a==='copy'){const t=$('#ex'),m=$('#cm');t.focus();t.select();const done=()=>{m.textContent='Código copiado.'},fail=()=>{m.textContent='Mantén presionado el código y elige Copiar.'},old=()=>{let ok=false;try{ok=document.execCommand('copy')}catch(x){}ok?done():fail()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(done,old);else old();
  return}
 if(a==='study'){S.active=id;save();startReview();startQuiz();view='review'}
 else if(a==='edit'){const s=S.sets.find(x=>x.id===id);E={id,title:s.title,rows:parse(s.text)};if(!E.rows.length)E.rows=[{t:'',d:''}];view='edit'}
 else if(a==='new'){E={id:null,title:'',rows:[{t:'',d:''},{t:'',d:''},{t:'',d:''}]};view='edit'}
 else if(a==='cancel'){view='sets'}
 else if(a==='save'){readE();
  const rs=E.rows.filter(r=>r.t.trim()||r.d.trim());
  if(!E.title.trim()){E.err='Agrega un título al set.'}
  else if(!rs.length){E.err='Agrega al menos una tarjeta.'}
  else if(rs.some(r=>!r.t.trim()||!r.d.trim())){E.err='Hay tarjetas incompletas. Llena los dos campos o quítalas con ✕.'}
  else{E.text=ser(rs);if(E.id){const s=S.sets.find(x=>x.id===E.id);s.title=E.title.trim();s.text=E.text}
   else{const n=uid();S.sets.push({id:n,title:E.title.trim(),text:E.text});S.active=n}
   save();R={};Q={};view='sets'}}
 else if(a==='del'){readE();if(!E.sure){E.sure=true}else{S.sets=S.sets.filter(x=>x.id!==E.id);if(!S.sets.length){S=null;load()}if(!cur())S.active=S.sets[0].id;save();R={};Q={};view='sets'}}
 else if(a==='flip'){R.flip=!R.flip}
 else if(a==='again'){R.q.push(R.q.shift());R.flip=false}
 else if(a==='known'){R.q.shift();R.known++;R.flip=false}
 else if(a==='restart'){startReview()}
 else if(a==='pick'){if(Q.pick===null){Q.pick=+b.dataset.j;const it=Q.items[Q.i];if(it.opts[Q.pick]===it.k)Q.score++}}
 else if(a==='next'){Q.i++;Q.pick=null}
 else if(a==='requiz'){startQuiz()}
 else if(a==='addrow'){readE();E.rows.push({t:'',d:''});FOC=true}
 else if(a==='delrow'){readE();E.rows.splice(+b.dataset.i,1);if(!E.rows.length)E.rows.push({t:'',d:''})}
 else if(a==='bulk'){readE();const n=parse($('#bk').value);if(n.length){E.rows=E.rows.filter(r=>r.t.trim()||r.d.trim()).concat(n);E.err=''}else{E.err='Escribe cada tarjeta en una línea así: término :: definición.'}}
 else if(a==='focus'){focus=!focus;document.body.classList.toggle('focus',focus)}
 else if(a==='t5'){startT(5)}else if(a==='t10'){startT(10)}else if(a==='tstop'){clearInterval(tick);T=null}
 else if(a==='exp'){const s=S.sets.find(x=>x.id===id);E={code:enc(s)};view='export'}
 else if(a==='imp'){E={code:'',err:''};view='import'}
 else if(a==='doimp'){E.code=$('#im').value;const d=dec(E.code);
  if(!d){E.err='El código no es válido. Cópialo completo e inténtalo otra vez.'}
  else{const n=uid();S.sets.push({id:n,title:d.title,text:d.text});S.active=n;save();R={};Q={};view='sets'}}
 render();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('id')){const w=[...document.querySelectorAll('.rw')];if(e.target.closest('.rw')===w[w.length-1]){e.preventDefault();readE();E.rows.push({t:'',d:''});FOC=true;render();return}}
 if(e.key==='Escape'&&focus){focus=false;document.body.classList.remove('focus');render();return}
 if(view!=='review'||!R.q||!R.q.length||/INPUT|TEXTAREA/.test(e.target.tagName))return;
 if(e.key===' '||e.key==='Enter'){if(e.target.closest('button'))return;e.preventDefault();R.flip=!R.flip}
 else if(e.key==='ArrowRight'){R.q.shift();R.known++;R.flip=false}
 else if(e.key==='ArrowLeft'){R.q.push(R.q.shift());R.flip=false}
 else return;
 render();
});
load();render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
